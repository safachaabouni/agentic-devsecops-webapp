name: CI

permissions:
  contents: read

on:
  push:
    branches: ["master"]
  pull_request:
    branches: ["master"]

jobs:
  # 1) Secret scanning
  secrets-scan:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Install Gitleaks
        run: |
          GITLEAKS_VERSION=8.18.4
          wget -qO gitleaks.tar.gz "https://github.com/gitleaks/gitleaks/releases/download/v${GITLEAKS_VERSION}/gitleaks_${GITLEAKS_VERSION}_linux_x64.tar.gz"
          tar -xzf gitleaks.tar.gz
          chmod +x gitleaks
          sudo mv gitleaks /usr/local/bin/gitleaks

      - name: Run Gitleaks and export JSON report
        run: |
          gitleaks detect --source . --report-format json --report-path gitleaks-report.json
        continue-on-error: true

      - name: Upload Gitleaks artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: gitleaks-report
          path: gitleaks-report.json
          if-no-files-found: warn

  # 2) SAST
  sast-semgrep:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Semgrep
        run: pip install semgrep

      - name: Run Semgrep and export JSON report
        run: |
          semgrep --config p/ci --json --output semgrep-report.json
        continue-on-error: true

      - name: Upload Semgrep artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: semgrep-report
          path: semgrep-report.json
          if-no-files-found: warn

  # 3) Build backend image
  build-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t backend .

  # 4) Build frontend
  build-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Build frontend
        run: |
          cd frontend
          npm install
          npm run build

  # 5) Tests backend
  test-backend:
    runs-on: ubuntu-latest

    services:
      postgres:
        image: postgres:15
        env:
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          POSTGRES_DB: testdb
        ports:
          - 5432:5432
        options: >-
          --health-cmd="pg_isready -U postgres"
          --health-interval=10s
          --health-timeout=5s
          --health-retries=5

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Install deps, migrate DB and run tests
        env:
          POSTGRES_SERVER: localhost
          POSTGRES_PORT: 5432
          POSTGRES_DB: testdb
          POSTGRES_USER: postgres
          POSTGRES_PASSWORD: postgres
          DATABASE_URL: postgresql+psycopg://postgres:postgres@localhost:5432/testdb
        run: |
          cd backend
          uv sync --frozen
          uv run alembic upgrade head
          uv run pytest

  # 6) Dependency scanning (Python)
  deps-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install uv
        uses: astral-sh/setup-uv@v3

      - name: Audit backend dependencies and export JSON report
        run: |
          cd backend
          uv sync --frozen
          uv run pip install pip-audit
          uv run pip-audit -f json -o ../pip-audit-report.json
        continue-on-error: true

      - name: Upload pip-audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: pip-audit-report
          path: pip-audit-report.json
          if-no-files-found: warn

  # 7) Dependency scanning (Node)
  deps-frontend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-node@v4
        with:
          node-version: "22"

      - name: Install frontend dependencies
        run: |
          cd frontend
          npm install

      - name: Run npm audit and export JSON report
        run: |
          cd frontend
          npm audit --json > ../npm-audit-report.json || true

      - name: Upload npm audit artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: npm-audit-report
          path: npm-audit-report.json
          if-no-files-found: warn

  # 8) Container security scan (Trivy)
  container-scan-backend:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Build backend image
        run: docker build -f backend/Dockerfile -t backend:ci .

      - name: Trivy scan (backend image) - export JSON report
        uses: aquasecurity/trivy-action@0.24.0
        with:
          image-ref: backend:ci
          format: json
          output: trivy-report.json
          severity: "CRITICAL,HIGH"
          exit-code: "0"

      - name: Upload Trivy artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: trivy-report
          path: trivy-report.json
          if-no-files-found: warn

  # 9) IaC scan
  iac-scan-checkov:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Checkov (IaC scanning)
        uses: bridgecrewio/checkov-action@v12
        with:
          file: .github/workflows/ci.yml
          framework: github_actions
          output_format: sarif
          output_file_path: checkov-report.sarif
          skip_check: CKV_GHA_7
          soft_fail: true

      - name: Upload Checkov artifact
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: checkov-report
          path: checkov-report.sarif
          if-no-files-found: warn

  # 10) SBOM
  sbom-generate:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Generate SBOM with Syft
        uses: anchore/sbom-action@v0
        with:
          format: cyclonedx-json
          output-file: sbom.cyclonedx.json

      - name: Upload SBOM artifact
        uses: actions/upload-artifact@v4
        with:
          name: sbom-cyclonedx
          path: sbom.cyclonedx.json

  # 11) DAST
  dast-zap:
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4

      - name: Start services (Docker Compose)
        run: |
          docker compose up -d db backend
          echo "Waiting for backend health..."
          for i in {1..30}; do
            if curl -fsS http://localhost:8000/api/v1/utils/health-check > /dev/null 2>&1; then
              echo "Backend is up!"
              break
            fi
            sleep 3
          done

          if ! curl -fsS http://localhost:8000/api/v1/utils/health-check > /dev/null 2>&1; then
            echo "Backend did not become ready in time"
            docker compose ps
            docker compose logs --no-color backend || true
            exit 1
          fi

      - name: OWASP ZAP Baseline Scan (DAST)
        uses: zaproxy/action-baseline@v0.12.0
        with:
          target: http://localhost:8000
          fail_action: false
          cmd_options: "-J zap_report.json -r zap_report.html"

      - name: Locate ZAP reports
        if: always()
        run: |
          echo "Searching for ZAP reports..."
          find . -type f \( -name "zap_report.json" -o -name "zap_report.html" \) || true

      - name: Copy ZAP reports to workspace root
        if: always()
        run: |
          JSON_FILE=$(find . -type f -name "zap_report.json" | head -n 1)
          HTML_FILE=$(find . -type f -name "zap_report.html" | head -n 1)

          if [ -n "$JSON_FILE" ]; then
            cp "$JSON_FILE" ./zap_report.json
          fi

          if [ -n "$HTML_FILE" ]; then
            cp "$HTML_FILE" ./zap_report.html
          fi

          ls -l zap_report.json zap_report.html 2>/dev/null || true

      - name: Upload ZAP artifacts
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: zap-dast-report
          path: |
            zap_report.json
            zap_report.html
          if-no-files-found: warn

      - name: Stop services
        if: always()
        run: docker compose down -v
  # 12) AI security agent = final decision maker
    ai-security-agent:
    runs-on: ubuntu-latest
    needs:
      - secrets-scan
      - sast-semgrep
      - deps-backend
      - deps-frontend
      - container-scan-backend
      - iac-scan-checkov
      - sbom-generate
      - dast-zap
    if: always()

    steps:
      - uses: actions/checkout@v4

      - uses: actions/setup-python@v5
        with:
          python-version: "3.12"

      - name: Install Python dependencies
        run: |
          pip install openai

      - name: Download all scan artifacts
        uses: actions/download-artifact@v4
        with:
          path: artifacts

      - name: Show downloaded artifacts
        run: |
          echo "Artifacts tree:"
          find artifacts -maxdepth 3 -type f | sort || true

      - name: Run AI security agent
        env:
          OPENAI_API_KEY: ${{ secrets.OPENAI_API_KEY }}
        run: |
          python scripts/ai_security_agent.py

      - name: Publish AI summary to GitHub Actions
        if: always()
        run: |
          cat ai-security-summary.md >> "$GITHUB_STEP_SUMMARY"

      - name: Upload AI security outputs
        if: always()
        uses: actions/upload-artifact@v4
        with:
          name: ai-security-summary
          path: |
            ai-security-summary.md
            ai-decision.json
          if-no-files-found: warn
